<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="幻语">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>幻语 · 角色扮演对话</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ 侧边抽屉:对话 / 角色 / 技能 ============ -->
  <aside id="drawer" aria-label="侧边栏">
    <div class="drawer-head">
      <div class="brand">
        <div class="brand-logo">幻</div>
        <div class="brand-text">
          <b>幻语</b>
          <span>角色扮演对话</span>
        </div>
        <button class="icon-btn theme-toggle" id="themeToggle" title="切换主题"></button>
      </div>
      <div class="search-wrap">
        <span class="search-ico"></span>
        <input id="searchInput" type="search" placeholder="搜索对话 / 角色 / 技能" autocomplete="off">
      </div>
      <nav class="drawer-tabs">
        <button class="dtab active" data-tab="conv">对话</button>
        <button class="dtab" data-tab="world">世界</button>
        <button class="dtab" data-tab="char">角色</button>
        <button class="dtab" data-tab="skill">技能</button>
      </nav>
    </div>
    <div class="drawer-body">
      <div class="dtab-page" data-page="conv">
        <button class="new-chat-btn" id="newChatBtn"><span class="ic-plus"></span>开启新冒险</button>
        <div id="convList" class="item-list"></div>
        <div class="empty-tip" data-empty="conv" hidden>还没有对话，点击上方开启～</div>
      </div>
      <div class="dtab-page" data-page="world" hidden>
        <button class="add-btn" id="addWorldBtn"><span class="ic-plus"></span>创造新世界</button>
        <div id="worldGrid" class="char-grid"></div>
        <div class="empty-tip" data-empty="world" hidden>还没有世界，创造一个吧～</div>
      </div>
      <div class="dtab-page" data-page="char" hidden>
        <button class="add-btn" id="addCharBtn"><span class="ic-plus"></span>创建角色</button>
        <div id="charGrid" class="char-grid"></div>
        <div class="empty-tip" data-empty="char" hidden>还没有角色，创建一个吧～</div>
      </div>
      <div class="dtab-page" data-page="skill" hidden>
        <button class="add-btn" id="addSkillBtn"><span class="ic-plus"></span>新建技能</button>
        <div id="skillList" class="item-list"></div>
        <div class="empty-tip" data-empty="skill" hidden>还没有技能，新建一个吧～</div>
      </div>
    </div>
    <div class="drawer-foot">
      <button class="foot-btn" id="settingsBtn"><span class="ic-settings"></span>后台设置</button>
    </div>
  </aside>
  <div id="drawerBackdrop"></div>

  <!-- ============ 主聊天区 ============ -->
  <main id="chat">
    <header id="chatHeader">
      <button class="icon-btn" id="menuBtn" title="会话列表"></button>
      <div class="header-title" id="headerTitle">
        <div class="ht-avatar" id="htAvatar">?</div>
        <div class="ht-text">
          <div class="ht-name" id="htName">幻语</div>
          <div class="ht-sub" id="htSub">开启一段新的冒险</div>
        </div>
      </div>
      <button class="icon-btn" id="headerNewBtn" title="新对话"></button>
    </header>

    <div id="statusBar" hidden></div>

    <div id="msgList" aria-live="polite">
      <div id="msgInner"></div>
    </div>

    <footer id="composer">
      <div id="skillChips" hidden></div>
      <div class="composer-row">
        <button class="icon-btn round" id="attachBtn" title="附加技能"></button>
        <div class="input-shell">
          <textarea id="inputBox" rows="1" placeholder="写点什么…" enterkeyhint="send"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" disabled title="发送"></button>
      </div>
      <div class="composer-hint" id="composerHint">内容由 AI 生成，请注意甄别</div>
    </footer>
  </main>
</div>

<!-- 弹层 / 菜单 / 提示根节点 -->
<div id="sheetRoot"></div>
<div id="menuRoot"></div>
<div id="toastRoot"></div>
<div id="fileInputWrap" hidden><input type="file" id="importFile" accept="application/json"></div>

<script>
// 全局错误陷阱（便于排查；不影响功能）
window.__errors = [];
window.onerror = function (m, s, l, c) { window.__errors.push(String(m) + ' @' + (s || '').split('/').pop() + ':' + l + ':' + c); return false; };
window.addEventListener('unhandledrejection', function (e) { window.__errors.push('promise: ' + ((e.reason && e.reason.message) || e.reason)); });
</script>
<script src="js/markdown.js"></script>
<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
